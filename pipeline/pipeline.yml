AWSTemplateFormatVersion: "2010-09-09"
Description: VotaNet CI/CD Pipeline - CodePipeline V2 + CodeBuild + GitHub

Parameters:
  GitHubRepo:
    Type:  String
    Default: geissler01/IaC-Serverless-infra
    Description: Repositorio de GitHub en formato usuario/nombre-repo

  GitHubBranch:
    Type: String
    Default: main
    Description: Rama que dispara el pipeline automatico

Resources:
  # 1. Conexion segura entre AWS y GitHub (AWS CoderStar Connection)
  GitHubConnection: # se crea en estado pendiente, toca ir a la consola y escribir la contraseña del github
    Type: AWS::CodeStarConnections::Connection # recurso de enlace externo en aws: funciona como una embajada de aws en GitHub, permite no tener que usar contraseñas
    Properties:
      ConnectionName: votanet-github-connection # nombre fisico que se vera en la consola
      ProviderType: GitHub # aqui pueden cambiar de proveedor, pero casi siempre sera github
  
  # 2. Permiso par que CodePipeline pueda usar la conexion de GitHub
  CodePipelineConnectionPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument: 
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: # para que pueda usar el puente entre CodePipeline y GitHub
              - codestar-connections:UseConnection
              - codeconnections:UseConnection
            Resource: !GetAtt GitHubConnection.ConnectionArn
      PolicyName: CodePipelineConnectionPolicy # nombre fisico en la consola
      Roles:
        # Extrae el nombre del rol a partir de ARM exportado en la fase 2
        - !Select [1, !Split ["role/", !ImportValue CodePipelineRoleArn]]
        # El ARN que exportamos en la Fase 2 tiene esta forma: # arn:aws:iam::841702867308:role/votanet-dev-prereq-stack-CodePipelineRole-kytXr6hYljJc
# !Split ["role/", ARN]: Corta ese texto largo usando la palabra "role/" como tijera. Quedan dos pedazos:
# Pedazo [0]: "arn:aws:iam::841702867308:"
#  [1]: "votanet-dev-prereq-stack-CodePipelineRole-kytXr6hYljJc"
# !Select [1, ...]: Toma el pedazo 1, que es exactamente el nombre del rol que CloudFormation necesita.

  # 3. Proyecto CodeBuild (el obrero de compilacion)
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: votanet-dev-build # nombre fisico en la consola
      Description: Compila y empaqueta la aplicacion Serverless VotaNet
      Artifacts:
        Type: CODEPIPELINE # Le dice a CodeBuild: "No guardes tú mismo los archivos finales en una carpeta local; entrégaselos directamente al director de orquesta (CodePipeline) para que él se los pase a CloudFormation".
      ServiceRole: !ImportValue CodeBuildRoleArn # Le asigna el sombrero para que pueda escribir en CloudWatch y S3
      Environment: 
        Type: LINUX_CONTAINER # la compilacion correrá dentro de un contenedor Docker Linux
        ComputeType: BUILD_GENERAL1_SMALL # 2 vCPU y 4 GB ram, opcion barata y suficiente
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0 # imagen docker oficial soportada por aws
        EnvironmentVariables:
          # Inyeccion de la variable que necesita el buildspec.tml
          - Name: S3_BUCKET
            Value: !ImportValue S3ArtifactsBucket
      Source:
        Type: CODEPIPELINE # indica que el codigo fuente no lo va a descargar de forma aislada, sino que vendrá del paso previo del pipeline (la etapa de GitHub)
        # Le indicamos la ruta exacta donde se guardo el buildspec
        BuildSpec: config/buildspec.yml #  ruta exacta dentro de tu repositorio donde guardaste la receta de instrucciones que construimos hace un momento.
  
  # 4. Orquestador CodePipeline V2
  VotaNetPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: votanet-dev-pipeline
      PipelineType: V2 # version moderna de CodePipeline 2023/2024
      # Un artefacto en como el testigo de una carrera de relevos
      ArtifactStore: # indica donde guardar los astefacts o cajas intermedias
        Type: S3
        Location: !ImportValue S3ArtifactsBucket
      RoleArn: !ImportValue CodePipelineRoleArn
      Stages:
        # Etapa 1: Source (GitHub)
        - Name: Source
          Actions:
            - Name: GitHubSource # tarea concreta, pueden haber varias
              ActionTypeId: # cedula de identidad de la accion
                Category: Source # le dice a AWS: "Esta acción no necesita recibir archivos previos; su trabajo es CREAR/ORIGINAR el código"
                Owner: AWS
                Provider: CodeStarSourceConnection # Le dice: "Vas a usar el conector OAuth que creamos para hablar con GitHub".
                Version: '1'
              OutputArtifacts:
                - Name: SourceArtifacts
              Configuration:
                ConnectionArn: !GetAtt GitHubConnection.ConnectionArn
                FullRepositoryId: !Ref GitHubRepo
                BranchName: !Ref GitHubBranch
                DetectChanges: true # Para que el proceso arranque de inmediato al detectar cambios en la rama main

        # Etapa 2: Build (CodeBuild)
        - Name: Build
          Actions:
            - Name: SAMBuildPackage
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild # el motor de ejecucion es el servidor AWS CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceArtifacts # es la caja que preparó GitHub en la etapa 1.
              OutputArtifacts:
                - Name: BuildArtifacts
              Configuration:
                ProjectName: !Ref CodeBuildProject

        # Etapa 3: Deploy (CloudFormation ChangeSet)
        - Name: Deploy
          Actions:
            # 3.1 Crear o reemplazar el ChangeSet: Conjunto de cambios
            - Name: CreateChangeSet
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              InputArtifacts: 
                - Name: BuildArtifacts
              Configuration:
                ActionMode: CHANGE_SET_REPLACE
                StackName: votanet-dev-app-stack # el stack que queremos actualizar
                ChangeSetName: pipeline-changeset
                TemplatePath: BuildArtifacts::packaged.yaml # Significa: "Abre el archivo comprimido BuildArtifacts y adentro busca el archivo llamado packaged.yaml".
                RoleArn: !ImportValue CloudFormationDeployRoleArn
                Capabilities: CAPABILITY_IAM,CAPABILITY_NAMED_IAM
              RunOrder: 1

            # 3.2 Ejecutar el ChangeSet para aplicar los cambios en vivo
            - Name: ExecuteChangeSet
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CHANGE_SET_EXECUTE
                StackName: votanet-dev-app-stack
                ChangeSetName: pipeline-changeset
              RunOrder: 2    

Outputs:
  PipelineUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${VotaNetPipeline}/view"
    Description: Enlace directo a la consola de AWS CodePipeline
  
  ConnectionArn:
    Value: !GetAtt GitHubConnection.ConnectionArn
    Description: ARN de la conexion de github (requiere autorizacion en la consola)